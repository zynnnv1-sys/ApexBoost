name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -o *.zip
          find . -maxdepth 2 -name "build.gradle.kts" -o -name "build.gradle" | while read file; do
            dir=$(dirname "$file")
            if [ "$dir" != "." ] && [ "$dir" != "./app" ]; then
              cp -r "$dir"/* . 2>/dev/null || true
            fi
          done
        fi

    - name: Generate Missing Gradle Configs
      run: |
        mkdir -p gradle
        cat << 'EOF' > gradle/libs.versions.toml
        [versions]
        agp = "8.4.1"
        kotlin = "2.0.0"

        [plugins]
        android-application = { id = "com.android.application", version.ref = "agp" }
        kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
        kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ApexBoost-GameBooster
        path: "**/build/outputs/apk/debug/*.apk"
